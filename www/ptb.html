        <script>
            //Makes Hamburger menu appear and disappear// 
            
            function collapseMenu(){
                let mobileNavList = document.getElementById("mobileNav");
                if (mobileNavList.style.display === "block") {
                    mobileNavList.style.display = "none";
                } else {
                    mobileNavList.style.display = "block";
                }
            };

            //loads pokemon data upon page loaded
            let pokeData = [];
            document.addEventListener('DOMContentLoaded', function() {
                console.log("Loaded page")
                getPokeData();
            });
            async function getPokeData() {
                const promise = await fetch('/Pokedex')
                pokeData = await promise.json()
                console.log(pokeData) 
            };
            //search funtion
            let searchList = []
            function pokeSearch(){
                const search = document.getElementById('pokeSearch').value
                searchList = []
                console.log(search)
                for (const pokemon of pokeData) {
                    if (pokemon["name"].toLowerCase().startsWith(search)) {
                        searchList.push(pokemon)
                    }
                }
                console.log(searchList)
            };
            function pokeAdd(){
                console.log(searchList)
                const container = document.querySelector('.empty')
                const pokemon = searchList[0]

                //pokemon image overlay
                const pokeImage = document.createElement('img')
                pokeImage.setAttribute('src', `static/img/pokemon_collection/${pokemon["name"]}.webp`)
                pokeImage.setAttribute('alt', `${pokemon["name"]} sprite`)
                pokeImage.setAttribute('class', 'pokeSprite')
                const pokemoncontainer = container.querySelector('.pokeEntry')

                container.classList = "full"
                pokemoncontainer.appendChild(pokeImage)
                // const name = container.querySelector('.poke-name')
                // name.innerHTML = pokemon["name"]

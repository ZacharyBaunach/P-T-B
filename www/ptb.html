            // ---- HAMBURGER MENU ----
            //Makes Hamburger menu appear and disappear// 
            
            // Toggles mobile hamburger navigation menu display state and CSS classes
            function collapseMenu(){ 
                // Get the nav bar, its current class, and all the nav links
                let navContainer = document.getElementById("navigationBar");
                let mobileNav = navContainer.className;
                let webPages = document.getElementsByClassName("nav_list");

                //When clicked, changes the class of navigation list
                //and makes page links appear below hamburger menu.

                // Menu is currently closed -> open it
                if (mobileNav == "nav") {
                    navContainer.className = "hamburgerNav";

                    //This code hates me :( 
                    //and wouldn't show them all at once with just an 'of' loop.
                    //The nested loop was the only solution I found to this problem.
                    
                    for (let i=0; i<4; i++){

                        for (const page of webPages){

                            page.className = "nav_list_mobile";

                            
                            
                        }

                    }
                    
                } 

                //When clicked again, changes the class of navigation bar to
                //its initial class and hides page links.
                
                // Menu is currently open -> close it
                else {
                    let hamburgerPages = document.getElementsByClassName("nav_list_mobile")

                        navContainer.className = "nav";

                        //This code hates me :( 
                        //and wouldn't show them all at once with just an 'of' loop.
                        //The nested loop was the only solution I found to this problem.

                        for (let i=0; i<4; i++){
                            for (const page of hamburgerPages){
                                page.className = "nav_list"
                            }
                        }
                }
            }

            function collapseMenuGenFilter(){ 
                // Get the nav bar, its current class, and all the nav links
                let navContainer = document.getElementById("genFilterList");
                let mobileNav = navContainer.className;
                let webPages = document.getElementsByClassName("pokemonFilterItems");

                //When clicked, changes the class of navigation list
                //and makes page links appear below hamburger menu.

                // Menu is currently closed -> open it
                if (mobileNav == "generationFilter") {
                    navContainer.className = "mobileGenerationFilter";

                    //This code hates me :( 
                    //and wouldn't show them all at once with just an 'of' loop.
                    //The nested loop was the only solution I found to this problem.
                    
                    for (let i=0; i<4; i++){

                        for (const page of webPages){

                            page.className = "mobilepokemonFilterItems";

                            
                            
                        }

                    }
                    
                } 

                //When clicked again, changes the class of navigation bar to
                //its initial class and hides page links.
                
                // Menu is currently open -> close it
                else {
                    let hamburgerPages = document.getElementsByClassName("mobilepokemonFilterItems")

                        navContainer.className = "generationFilter";

                        //This code hates me :( 
                        //and wouldn't show them all at once with just an 'of' loop.
                        //The nested loop was the only solution I found to this problem.

                        for (let i=0; i<4; i++){
                            for (const page of hamburgerPages){
                                page.className = "pokemonFilterItems"
                            }
                        }
                }
            }

            // ---- LOAD POKEMON DATA ----
            //loads pokemon data upon page loaded (event in main.JS)
            // sets up page in certain order
            async function pageLoad() {
                await getPokeData();
                await setPokeImages();
                await getPokeMoves();
                popUpCreate();
                console.log('loading team from session storage')
                loadTeam();
            }
            // Asynchronous function to fetch Pokedex data from server endpoint
            async function getPokeData() {
                // Request the /Pokedex route from Flask and store the JSON result
                const promise = await fetch('/Pokedex');
                pokeData = await promise.json();
            };
            async function getPokeMoves() {
                // Request the /Pokedex route from Flask and store the JSON result
                const promise = await fetch('/PokeMoves');
                pokeMoves = await promise.json();
            };
            // Asynchronous function to create set of ten template links/images for pokemon pokedex entries
            async function setPokeImages() {
                // create pokmon templete images/call buttons
                // grab template container
                const templateContainer = document.querySelector('.homepagePokemon')
                // create entrys
                for (i = 0; i < 15; i++) {
                    const template = document.createElement('a')
                    template.setAttribute('href', `Pokemon/${i+1}`)
                    template.className='pokemonImageLink'
                    const image = document.createElement('img')
                    image.setAttribute('class', 'pokemonImage')
                    image.setAttribute('src', `static/img/pokemon_collection/${pokeData[i].name}.webp`)
                    image.setAttribute('alt', `${pokeData[i].name}`)
                    template.appendChild(image)
                    templateContainer.appendChild(template)
                }
                
            }


            //deloads current pokemon
            async function deloadPokemon(){

                let pokemonList = document.getElementsByClassName('pokemonImageLink');

                //Deletes current pokemon on page
            
                for (let i=0; i<10; i++){
                    for (let pokemon of pokemonList){
                        console.log(pokemon.remove())
                    }
                }
            }

        //////////////////////////////////////////////////////////////////////////
        //Generation Loads

            //Deletes Current Pokemon on page and loads first pokemon of generation specified
            async function generationLoad(startingPkm){

            

            //Set loadMorePokemon variable to the first pokemon after initial load
            loadMorePokemon = startingPkm;
            
            //Deloads current pokemon on page
            await deloadPokemon()
            

            //Load first 15 Pokemon of selected generation

            // create pokmon templete images/call buttons
                // grab template container
                const templateContainer = document.querySelector('.homepagePokemon')
                // create entrys
                for (let i = startingPkm-15; i < startingPkm; i++) {
                    const template = document.createElement('a')
                    template.setAttribute('href', `Pokemon/${i+1}`)
                    template.className='pokemonImageLink'
                    const image = document.createElement('img')
                    image.setAttribute('class', 'pokemonImage')
                    image.setAttribute('src', `static/img/pokemon_collection/${pokeData[i].name}.webp`)
                    image.setAttribute('alt', `${pokeData[i].name}`)
                    template.appendChild(image)
                    templateContainer.appendChild(template)
                }
                
        }

            // Loads additional pokemon templates at the user's request
            async function showMorePokemon(id){
                // create pokmon templete images/call buttons
                // grab template container
                const templateContainer = document.querySelector('.homepagePokemon')
                // create entrys
                let i = id

                //Hides the load more button once all pokemon are loaded
                if (id+15 > LASTPOKEMONID) {

                    //displays 151th Pokemon
                    const template = document.createElement('a')
                    template.setAttribute('href', `Pokemon/${i+1}`)
                    template.className='pokemonImageLink'
                    const image = document.createElement('img')
                    image.setAttribute('class', 'pokemonImage')
                    image.setAttribute('src', `static/img/pokemon_collection/${pokeData[i].name}.webp`)
                    image.setAttribute('alt', `${pokeData[i].name}`)
                    template.appendChild(image)
                    templateContainer.appendChild(template)

                    let loadPokemonButton = document.getElementById('loadPkmButton')

                    
                    loadPokemonButton.className = "allPkmLoaded"

                    return
                }
                loadMorePokemon = id+15
                for (i; i < loadMorePokemon; i++) {
                    const template = document.createElement('a')
                    template.setAttribute('href', `Pokemon/${i+1}`)
                    template.className='pokemonImageLink'
                    const image = document.createElement('img')
                    image.setAttribute('class', 'pokemonImage')
                    image.setAttribute('src', `static/img/pokemon_collection/${pokeData[i].name}.webp`)
                    image.setAttribute('alt', `${pokeData[i].name}`)
                    template.appendChild(image)
                    templateContainer.appendChild(template)

                
            }
        }

        

            // ---- POPUP TEAM MIRROR ----
            //intial clone for popup box
            // Clones main team container to build the popup selection mirror interface
            function popUpCreate() {
                //creating user team popup
                const teamContainer = document.querySelector(".teamContainer")
                const clone = teamContainer.cloneNode(true)
                clone.setAttribute('id','teambox')
                const teambox = document.getElementById("pokemonPopup")
                var i = 1
                // Loop through each cloned slot and rename/wire it up for the popup
                for (const node of clone.children) {
                    const actionNode = node.children[0]
                    actionNode.removeAttribute('popovertarget')
                    actionNode.setAttribute('id', `pokeEntry${i}mirror`)
                    actionNode.setAttribute('onclick', `displayEntry(undefined, ${i})`)
                    actionNode.setAttribute('class', 'closed')
                    i += 1
                }
                //append selection box mirror to popup
                teambox.appendChild(clone)
                //then add hidden editbox
                const editbox = document.createElement('div')
                editbox.setAttribute('id', 'editBox')
                editbox.setAttribute('class', 'hidden')
                teambox.appendChild(editbox)

                //creating enemy team popup
                const enemyTeamContainer = document.querySelector(".enemyTeamContainer")
                const enemyClone = enemyTeamContainer.cloneNode(true)
                enemyClone.setAttribute('id','enemyTeamBox')
                const enemyTeambox = document.getElementById("enemyPokemonPopup")
                var i = 1
                // Loop through each cloned slot and rename/wire it up for the popup
                for (const node of enemyClone.children) {
                    const actionNode = node.children[0]
                    actionNode.removeAttribute('enemyPopovertarget')
                    actionNode.setAttribute('id', `enemyPokeEntry${i}mirror`)
                    actionNode.setAttribute('onclick', `displayEntry(${i})`)
                    actionNode.setAttribute('class', 'closed')
                    i += 1
                }
                //append selection box mirror to popup
                enemyTeambox.appendChild(enemyClone)
                //then add hidden editbox
                const enemyEditbox = document.createElement('div')
                enemyEditbox.setAttribute('id', 'enemyEditBox')
                enemyEditbox.setAttribute('class', 'hidden')
                enemyTeambox.appendChild(enemyEditbox)
            };

            // ---- SEARCH ----
            //search funtion
            // Filters Pokedex data entries based on user input search queries
            // Holds the Pokemon that match the current search text
            function pokeSearch(){
                // Read what the user typed
                const search = document.getElementById('pokeSearch').value
                pokeSearchList = []
                console.log(search)
                // Keep every Pokemon whose name starts with the search text
                for (const pokemon of pokeData) {
                    if (pokemon["name"].toLowerCase().startsWith(search)) {
                        pokeSearchList.push(pokemon)
                    }
                }
            };

            
            // ---- ADD POKEMON ----
            //adds pokemon data to each pokemon entry
            // Adds selected Pokémon sprites and data attributes into active team slots
            function pokeAdd(element, num = 7){
                console.log(element)
                console.log('num:')
                console.log(num)
                if (element == null || element.id == 'pokemonPopup') {
                    element = document.querySelector('.teamContainer')
                } else {
                    element = document.querySelector('.enemyTeamContainer')
                }
                //init pokmeon to add
                // Uses the first match from the search list
                const pokemon = pokeSearchList[0];
                const name = pokemon.name.toLowerCase();
                pokemon.moves = pokeMoves[`${name}`];

                //locating team areas
                //main team locaitons
                const teamArea = element.querySelectorAll(".entry");
                //popup team locations
                const popupArea = document.querySelectorAll(`.${element.className}`)[1]
                const popupTeamArea = popupArea.querySelectorAll(".entry");

                //pokemon image overlay
                // Build the sprite image for this Pokemon
                const pokeImage = document.createElement('img');
                pokeImage.setAttribute('src', `static/img/pokemon_collection/${pokemon["name"]}.webp`);
                pokeImage.setAttribute('alt', `${pokemon["name"]} sprite`);
                pokeImage.setAttribute('class', 'pokeSprite');

                //find location to insert new pokemon (may overwrite)
                let location = teamArea[num % TEAM_LIMIT].childNodes[1]
                let mirrorLocation = popupTeamArea[num % TEAM_LIMIT].childNodes[1]
                if (num == 7 ) {
                    location = document.querySelector('.open');
                    mirrorLocation = popupArea.querySelector('.open');
                };

                //clean up old image
                // (index % TEAM_LIMIT wraps around so slots cycle 1-6)
                location.innerHTML = '';
                mirrorLocation.innerHTML = '';
                //attaches pokemon data/pic to entry
                location.entry = pokemon;
                location.appendChild(pokeImage);

                // update session storage
                const locationID = (location.id.at(-1))
                sessionStorage.setItem(`${locationID}`, JSON.stringify(pokemon));
                
                //update popup
                // Copy the sprite into the popup's team mirror too
                const newPokeImage = pokeImage.cloneNode();
                mirrorLocation.entry = pokemon;
                mirrorLocation.appendChild(newPokeImage);
                // update popup display
                displayEntry(element, locationID)
            };

            // ---- DISPLAY ENTRY DETAILS ----
            //this is for display of popup to adjust evs not complete at moment
            // Displays detailed stats or configuration options when clicking a team entry
            function displayEntry(element, num) {
                console.log('num:')
                console.log(num)
                if (element == null) {
                    element = document.querySelector('.teamContainer')
                }
                // Find the popup team box and the clicked slot
                const displayContainer = document.querySelectorAll(`.${element.className}`)[1]
                console.log(displayContainer)

                if (displayContainer.querySelector('.open')) {
                    const prevOpen = displayContainer.querySelector('.open')
                    prevOpen.setAttribute('class', 'closed')
                    const prevBaseOpen = document.querySelector(`.open`)
                    prevBaseOpen.setAttribute('class', 'closed')
                }

                const entry = document.querySelector(`#pokeEntry${num}mirror`)
                entry.setAttribute('class', 'open')
                const entryBase = document.querySelector(`#pokeEntry${num}`)
                entryBase.setAttribute('class', 'open')


                const pokemonEntry = entry.entry

                //display pokemon data
                // Show name, abilities and base stats under the clicked slot

                //main stat edit box
                console.log(displayContainer)
                const editBox = displayContainer.parentNode.querySelector('#editBox');
                editBox.innerHTML = '';

                //text stat box
                const textbox = document.createElement("div");
                textbox.setAttribute('id','pokeDisplayStats');
                textbox.innerHTML = `${pokemonEntry.name}`;


                //creates the ability selection
                const abilityBox = document.createElement('select');
                abilityBox.setAttribute('class', `selectAbilityBox`);
                abilityBox.setAttribute('id', 'ability');
                //inits and checks if session has previous ability
                let activeAbility = ''
                if (pokemonEntry.activeAbility) {
                        activeAbility = pokemonEntry.activeAbility;
                    };
                for (ability of pokemonEntry.abilities) {
                    const possibleAbility = document.createElement('option');
                    possibleAbility.setAttribute('class', `${ability}`);
                    possibleAbility.setAttribute('value', `${ability}`);
                    possibleAbility.innerHTML = `${ability}`;
                    if (activeAbility && ability === activeAbility) {
                        possibleAbility.selected = true
                    }
                    abilityBox.addEventListener('change',abilityAttach);
                    abilityBox.appendChild(possibleAbility);
                };

                //sets up the four move selection boxes
                const moveBox = document.createElement("div");
                moveBox.setAttribute('id',"moveBox");

                //create move selection dropdown menus
                for (i = 1; i<=MOVE_LIMIT; i++) {
                    const move = document.createElement('select');
                    move.setAttribute('class', `selectMoveBox`);
                    move.setAttribute('id', `move${i}`);
                    //generic empty option default and append to move box
                    const emptyMove = document.createElement('option');
                    emptyMove.setAttribute('value', '');
                    emptyMove.innerHTML = `>--Choose a Move--<`;
                    move.appendChild(emptyMove);
                    //saved move from session storage
                    let savedMove = ''
                    if (pokemonEntry.selectedMoves) {
                        savedMove = pokemonEntry.selectedMoves[i-1];
                    };
                    //for each move selection box append all possible move options
                    for (j = 0; j< pokemonEntry.moves.length; j++) {
                        const possibleMove = document.createElement('option');
                        possibleMove.setAttribute('class', `${pokemonEntry.moves[j]}`);
                        possibleMove.setAttribute('value', `${pokemonEntry.moves[j]}`);
                        possibleMove.innerHTML = `${pokemonEntry.moves[j]}`;
                        if (savedMove && `${pokemonEntry.moves[j]}` === savedMove) {
                            possibleMove.selected = true;
                        }
                        move.appendChild(possibleMove);
                    };
                    moveBox.appendChild(move);
                };
                const dropMenus = moveBox.querySelectorAll(`.selectMoveBox`);
                for (menu of dropMenus) {
                    menu.addEventListener('change',onlyOneMove);
                };
                
                //ajustable stat sliders
                const statBox = document.createElement("div");
                statBox.setAttribute('id',"statsContainer");

                //stats text labels
                const statTextContainer = document.createElement("div");
                statTextContainer.setAttribute('id',"statTextContainer");
                const statText = ["HP", "Attack", "Defence", "Sp Atk.", "Sp Def", "Speed"];
                for (text of statText) {
                    const statTextBox = document.createElement("div");
                    statTextBox.setAttribute('id',`${text}_Text`);
                    statTextBox.innerHTML = `${text}`;
                    statTextContainer.appendChild(statTextBox);
                };

                //stats base values
                const statvalueContainer = document.createElement("div");
                statvalueContainer.setAttribute('id',"statTextContainer");
                const statList = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'];
                for (const stat of statList) {
                    const statValueBox = document.createElement("div");
                    const baseStatValue = pokemonEntry.baseStats[stat];
                    statValueBox.setAttribute('id',`${stat}_Value`);
                    statValueBox.innerHTML = `${baseStatValue}`;
                    statvalueContainer.appendChild(statValueBox);
                };


                //stat slider DOM element creator
                const statSliderContainer = document.createElement('div');
                statSliderContainer.setAttribute('id',"statSliderContainer");
                for (const stat of statList) {
                    const statSlider = document.createElement("input");
                    statSlider.setAttribute('type', 'range');
                    statSlider.setAttribute('class', 'statSlider');
                    statSlider.setAttribute('id', stat);
                    statSlider.setAttribute('min', 0);
                    statSlider.setAttribute('max', 255);
                    statSlider.setAttribute('value', 0);
                    if (pokemonEntry.activeStats) {
                        const statValue = pokemonEntry.activeStats[stat]
                        statSlider.setAttribute('value', statValue);
                    };
                    //attach event to stat sliders to update stat total
                    statSlider.addEventListener('change',statSliderUpdate);
                    statSliderContainer.appendChild(statSlider);
                };

                //final stats text values
                const statTrueValueContainer = document.createElement("div");
                statTrueValueContainer.setAttribute('id',"statTrueValueContainer");
                for (stat of statList) {
                    const statTrueValueBox = document.createElement("div");
                    statTrueValueBox.setAttribute('id',`${stat}_TrueValue`);
                    let baseStateValue = 0
                    if (stat == 'hp') {
                        baseStatValue = hpStatCalc(pokemonEntry.baseStats[stat],undefined,undefined,undefined);
                        if (pokemonEntry.activeStats) {
                            baseStatValue = hpStatCalc(pokemonEntry.baseStats[stat],undefined,pokemonEntry.activeStats[stat],undefined);
                        }
                    } else {
                        baseStatValue = statCalc(pokemonEntry.baseStats[stat],undefined,undefined,undefined, undefined)
                        if (pokemonEntry.activeStats) {
                            baseStatValue = statCalc(pokemonEntry.baseStats[stat],undefined,pokemonEntry.activeStats[stat],undefined, undefined)
                        }
                    }
                    statTrueValueBox.innerHTML = `${baseStatValue}`;
                    statTrueValueContainer.appendChild(statTrueValueBox);
                };


                //append all stats to editBox
                statBox.appendChild(statTextContainer);
                statBox.appendChild(statvalueContainer)
                statBox.appendChild(statSliderContainer);
                statBox.appendChild(statTrueValueContainer)
                editBox.appendChild(statBox);
                editBox.setAttribute('class', 'open');
                editBox.appendChild(textbox);
                editBox.appendChild(abilityBox);
                editBox.appendChild(moveBox);
            };

            //funtion to be attached to pokemon moves to make sure double moves are impossible and attaches values to entry
            function onlyOneMove() {
                console.log('onlyOneMove triggered')
                let selectedMoves = [];
                const pokemonMoves = document.querySelectorAll('.selectMoveBox');
                console.log(pokemonMoves);
                for (menu of pokemonMoves) {
                    console.log(menu);
                    selectedMoves.push(menu.value);
                };
                console.log(selectedMoves);
                for (move of selectedMoves) {
                    if (move == '') {
                        continue;
                    }
                    const options = document.querySelectorAll(`option`);
                    for (moves of options) {
                        if (moves.value != '' && selectedMoves.includes(moves.value)) {
                            moves.disabled = true;
                        } else {
                            moves.disabled = false;
                        };
                    };
                };
                const pokemonEntry = document.querySelectorAll('.open')[1];
                pokemonEntry.entry.selectedMoves = selectedMoves;

                const locationID = (pokemonEntry.id.at(-7))
                sessionStorage.setItem(`${locationID}`, JSON.stringify(pokemonEntry.entry));
            };
        
            // Event function to be attached to pokemon abilities to attach ability to saved entry.
            function abilityAttach() {
                const chosenAbility = document.querySelector('#ability');
                console.log(chosenAbility)
                const ability = chosenAbility.value

                //updates session storage pokemon entry's ability
                const pokemonEntry = document.querySelectorAll('.open')[1];
                pokemonEntry.entry.activeAbility = ability;
                const locationID = (pokemonEntry.id.at(-7))
                sessionStorage.setItem(`${locationID}`, JSON.stringify(pokemonEntry.entry));
            };
        
            // Event function to be attached to statSliders to update saved EV count and reflect on actual stat values.
            function statSliderUpdate() {
                const statSliders = document.querySelector('#statSliderContainer').children
                let currentStats = {}
                for (statSlider of statSliders) {
                    const statsliderID = statSlider.id
                    console.log(statSlider)

                    const statValue = document.querySelector(`#${statsliderID}_Value`)
                    let newStatValue = 0
                    if (statsliderID == 'hp') {
                        newStatValue = hpStatCalc(+statValue.innerHTML,undefined,+statSlider.value,undefined)
                    } else {
                        newStatValue = statCalc(+statValue.innerHTML,undefined,+statSlider.value,undefined,undefined)
                    }
                    currentStats[statsliderID] = statSlider.value
                    const TrueStat = document.querySelector(`#${statsliderID}_TrueValue`)
                    TrueStat.innerHTML = newStatValue
                };

                //updates session storage pokemon entry's ability
                const pokemonEntry = document.querySelectorAll('.open')[1];
                pokemonEntry.entry.activeStats = currentStats;
                const locationID = (pokemonEntry.id.at(-7))
                sessionStorage.setItem(`${locationID}`, JSON.stringify(pokemonEntry.entry));
            };

        </script>

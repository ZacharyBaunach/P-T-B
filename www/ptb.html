        <header>
            
            <!-- Main page title -->
            <h1 class="pageTitle">Pokemon Team Builder</h1>

            <!-- Navigation bar (class switches between "nav" and "hamburgerNav" in collapseMenu()) -->

                <!-- Hamburger menu toggle the navigation links -->

                    <a href="javascript:void(0);" class="icon" onclick="collapseMenu()">
                        <i class="fa fa-bars"></i>
                    </a>
                </li>
                <!-- Navigation links: Home, Battle, About Us, Give Feedback -->
                <li class="nav_list" id="home" ><a class="nav_link" href="ptb.html" onclick="navHighlight(home)">Home</a></li>

                <li class="nav_list" id="about" ><a class="nav_link" href="about.html"  onclick="navHighlight(about)">About Us</a></li>
                <li class="nav_list" id="feedback" ><a class="nav_link" href="feedback.html"  onclick="navHighlight(feedback)">Give Feedback</a></li>
            </ul>

        <!-- INTRO PARAGRAPH -->
        <!-- Introductory description paragraph and external links -->
        <p>
            Build your team and test their strength against a team of your choosing. start building your team <a href=https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.pm8RJVUoR8qkObyqcszZWgHaNK%3Fpid%3DApi&f=1&ipt=70b1f513962aaae733c947dd9019fcf8785c6a1d66b65d8ed93f0b67fb95fbe3&ipo=images>here.</a>
            Eevee is my favorite Pokemon.
        </p>

        <!-- TEAM BOX -->
        <!-- Team Box -->
        <!-- Selection container for the 6 team slot buttons -->
        <div id="selection-box">

                <li class="entry", id="lst1">
                    <button id="pokeEntry1", popovertarget="pokemonPopup"></button>
                </li>
                <!-- Slot -->
                <li class="entry", id="lst2">
                    <button id="pokeEntry2", popovertarget="pokemonPopup"></button>

                </li>
                <!-- Slot -->

                </li>
                <!-- Slot -->
                <li class="entry", id="lst6">
                    <button id="pokeEntry6", popovertarget="pokemonPopup"></button>
                </li>
            </ul>
        </div>

        <!-- POPUP -->
        <!-- this is the popup screen for pokemon selection-->
        <!-- Popover modal dialog used for searching and adding Pokémon -->
        <div popover id="pokemonPopup">
            <!-- Search box: calls pokeSearch() as you type -->
            <input id= "pokeSearch", onkeyup=pokeSearch() type = "text", placeholder="Search..">
            <!-- Adds the first search result to the team (calls pokeAdd()) -->
            <button onclick="pokeAdd()">Add Pokemon</button>

            <!-- pokemon team edit screen; subject to change-->
            <!-- Container for detailed stats or editing inside the popup modal -->
            <div id="editBox">

            </div>
        </div>

        <script>

            src="static/js/main.js"

        <!-- Main page script -->
        <script>
            // ---- NAV HIGHLIGHT (unused, commented out) ----
            //Keeps currently sellected page highlighted//

            // function navHighlight(currentPage){
            //     let homePage = document.getElementById("home");
            //     let hP = homePage.className;
            //     let battlePage = document.getElementById("battle");
            //     let aboutPage = document.getElementById("about");
            //     let feedbackPage = document.getElementById("feedback");

            //     hP = "currentPage";
            // }


            // ---- HAMBURGER MENU ----
            //Makes Hamburger menu appear and disappear// 
            
            // Toggles mobile hamburger navigation menu display state and CSS classes
            function collapseMenu(){
                // Get the nav bar, its current class, and all the nav links
                let navContainer = document.getElementById("navigationBar");
                let mobileNav = navContainer.className;
                let webPages = document.getElementsByClassName("nav_list");

                //When clicked, changes the class of navigation list
                //and makes page links appear below hamburger menu.

                // Menu is currently closed -> open it
                if (mobileNav == "nav") {
                    navContainer.className = "hamburgerNav";

                    //This code hates me :( 
                    //and wouldn't show them all at once with just an 'of' loop.
                    //The nested loop was the only solution I found to this problem.
                    
                    for (let i=0; i<4; i++){

                        for (const page of webPages){

                            page.className = "nav_list_mobile";

                            
                            
                        }

                    }
                    
                } 

                //When clicked again, changes the class of navigation bar to
                //its initial class and hides page links.
                
                // Menu is currently open -> close it
                else {
                    let hamburgerPages = document.getElementsByClassName("nav_list_mobile")

                        navContainer.className = "nav";

                        //This code hates me :( 
                        //and wouldn't show them all at once with just an 'of' loop.
                        //The nested loop was the only solution I found to this problem.

                        for (let i=0; i<4; i++){
                            for (const page of hamburgerPages){
                                page.className = "nav_list"
                            }
                        }
                }
            }


            // ---- LOAD POKEMON DATA ----
            //loads pokemon data upon page loaded
            // Holds the Pokedex data fetched from the server
            let pokeData = [];
            // Event listener waiting for DOM content load to fetch Pokedex database entries
            document.addEventListener('DOMContentLoaded', function() {
                console.log("Loaded page")
                getPokeData();
            });
            // Asynchronous function to fetch Pokedex data from server endpoint
            async function getPokeData() {
                // Request the /Pokedex route from Flask and store the JSON result
                const promise = await fetch('/Pokedex')
                pokeData = await promise.json()
                console.log(pokeData) 
            };

            // ---- POPUP TEAM MIRROR ----
            //intial clone for popup box (you can change it if you have a better design in mind)
            // Clones main team container to build the popup selection mirror interface
            const teamContainer = document.getElementsByClassName("teamContainer")[0]
            const clone = teamContainer.cloneNode(true)
            clone.id = "teamBox"
            const teambox = document.getElementById("pokemonPopup")
            var i = 1
            // Loop through each cloned slot and rename/wire it up for the popup
            for (const node of clone.children) {
                const actionNode = node.children[0]
                actionNode.removeAttribute('popovertarget')
                actionNode.setAttribute('id', `pokeEntry${i}mirror`)
                actionNode.setAttribute('onclick', `displayEntry(${i})`)
                actionNode.setAttribute('class', 'closed')
                i += 1
            }
            //append selection box mirror to popup
            teambox.appendChild(clone)
            //then add hidden editbox
            const editbox = document.createElement('div')
            editbox.setAttribute('id', 'editBox')
            editbox.setAttribute('class', 'hidden')
            teambox.appendChild(editbox)

            // ---- SEARCH ----
            //search funtion
            // Filters Pokedex data entries based on user input search queries
            // Holds the Pokemon that match the current search text
            let pokeSearchList = []
            function pokeSearch(){
                // Read what the user typed
                const search = document.getElementById('pokeSearch').value
                pokeSearchList = []
                console.log(search)
                // Keep every Pokemon whose name starts with the search text
                for (const pokemon of pokeData) {
                    if (pokemon["name"].toLowerCase().startsWith(search)) {
                        pokeSearchList.push(pokemon)
                    }
                }
            };

            // ---- RESTORE SAVED TEAM ----
            //checks sessionStorage and loads in 'saved' team
            // Restores previously saved team selections from browser session storage on load
            // index = which slot gets filled next, teamSize = max team members
            let index = 0
            let teamSize = 6
            // Check each of the 6 slots for saved data and re-add it
            for (i = 1; i <= teamSize ; i++) {
                if (sessionStorage[i]){
                    pokeSearchList.push(JSON.parse(sessionStorage.getItem(i)))
                    console.log(`loading index ${i}`)
                    pokeAdd()
                    pokeSearchList.pop()
                }   else {
                    console.log(`empty session storage of index ${i}`)
                }
            };
            
            // ---- ADD POKEMON ----
            //adds pokemon data to each pokemon entry
            // Adds selected Pokémon sprites and data attributes into active team slots
            function pokeAdd(){
                //init pokmeon to add
                // Uses the first match from the search list
                const pokemon = pokeSearchList[0]
                
                //locating team areas
                //main team locaitons
                const MainArea = document.querySelector(".teamContainer")
                const teamArea = MainArea.querySelectorAll(".entry")
                //popup team locations
                const popupArea = document.querySelector("#pokemonPopup")
                const popupTeamArea = popupArea.querySelectorAll(".entry")

                //pokemon image overlay
                // Build the sprite image for this Pokemon
                const pokeImage = document.createElement('img')
                pokeImage.setAttribute('src', `static/img/pokemon_collection/${pokemon["name"]}.webp`)
                pokeImage.setAttribute('alt', `${pokemon["name"]} sprite`)
                pokeImage.setAttribute('class', 'pokeSprite')

                //clean up old image
                // (index % teamSize wraps around so slots cycle 1-6)
                teamArea[index % teamSize].childNodes[1].innerHTML = ''
                popupTeamArea[index % teamSize].childNodes[1].innerHTML = ''

                //attaches pokemon data/pic to entry
                teamArea[index % teamSize].childNodes[1].entry = pokemon
                console.log(popupTeamArea)
                teamArea[index % teamSize].childNodes[1].appendChild(pokeImage)

                // update session storage
                sessionStorage.setItem(`${index % teamSize + 1}`, JSON.stringify(pokemon))
                
                //update popup
                // Copy the sprite into the popup's team mirror too
                const newPokeImage = pokeImage.cloneNode()
                popupTeamArea[index % teamSize].childNodes[1].appendChild(newPokeImage)
                // Move on to the next slot
                index += 1
                console.log(index)
            };

            // ---- DISPLAY ENTRY DETAILS ----
            //this is for display of popup to adjust evs not complete at moment
            // Displays detailed stats or configuration options when clicking a team entry
            function displayEntry(num) {
                // Find the popup team box and the clicked slot
                const displayContainer = document.getElementById('teamBox')
                const entry = document.querySelector(`#pokeEntry${num}mirror`)
                entry.setAttribute('class', 'open')
                const pokemonEntry = entry.entry

                //display pokemon data
                // Show name, abilities and base stats under the clicked slot
                const textbox = document.createElement("div")
                textbox.setAttribute('id','pokeDisplayStats')
                textbox.innerHTML = `${pokemonEntry.name}, ablilities: ${pokemonEntry.abilities}, base-stats: ${pokemonEntry.baseStats}`
                displayContainer.children[num-1].appendChild(textbox)
                console.log(entry)
            }
        </script>

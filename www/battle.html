<!DOCTYPE html>
<html>
    <head>
        <title>
            Pokemon Team Builder Battle
        </title>
        <link rel="stylesheet" href="static/css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>

    <a href="ptb.html"> 
            <img src="static/img/Logo.png" alt="Logo" class="site-logo" >
    </a>

    <div class="pageBox">
    <body>
        <header>
            

            <h1 class="pageTitle">Pokemon Battle</h1>

            <ul id="navigationBar" class ="nav">
                <!-- Hamburger menu toggle the navigation links -->
                <li>
                    <a href="javascript:void(0);" class="icon" onclick="collapseMenu()">
                        <i class="fa fa-bars"></i>
                    </a>
                </li>
                <li class="nav_list"><a class="nav_link" href="ptb.html">Home</a></li>
                <li class="nav_list"><a class="nav_link" href="battle.html">Battle</a></li>
                <li class="nav_list"><a class="nav_link" href="about.html">About Us</a></li>
                <li class="nav_list"><a class="nav_link" href="feedback.html">Give Feedback</a></li>
            </ul>

            
        </header>

        <ul class="BattleContainer">
            
                <li class="PSpriteA">
                    <div class="entry"><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div class="entry"><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div class="entry"><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div class="entry"><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div class="entry"><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                        
                </li>

                <li class="MovesA">
                    <div>
                        <div id="move1" class="ActiveMoveA" onclick="allyMoveHighlight(move1)">Move</div>
                        <div id="move2" class="ActiveMoveA" onclick="allyMoveHighlight(move2)">Move</div>
                    </div>
                    <div>
                        <div id="move3" class="ActiveMoveA" onclick="allyMoveHighlight(move3)">Move</div>
                        <div id="move4" class="ActiveMoveA" onclick="allyMoveHighlight(move4)">Move</div>
                    </div>
                </li>

                <li class="ActiveSpriteA">
                    <img class="ASprite" src="static/img/Pokeball.png" alt="Sprite">
                </li>

                <li class="ActiveSpriteE">
                    <img class="ESprite" src="static/img/Pokeball.png" alt="Sprite">
                </li>

                <li class="MovesE">
                    <div>
                        <div id="move5" class="ActiveMoveE" onclick="enemyMoveHighlight(move5)">Move</div>
                        <div id="move6" class="ActiveMoveE" onclick="enemyMoveHighlight(move6)">Move</div>
                    </div>
                    <div>
                        <div id="move7" class="ActiveMoveE" onclick="enemyMoveHighlight(move7)">Move</div>
                        <div id="move8" class="ActiveMoveE" onclick="enemyMoveHighlight(move8)">Move</div>
                    </div>
                </li>

                <li class="PSpriteE">
                    <div><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                        
                </li>
            
        </ul>

        <div id="startTurn">
            Start Turn
        </div>

        <ul class="BattleWindowContainer">
            

            <li class="BattleWindow">

            </li>
        </ul>
        <script>
            //Makes Hamburger menu appear and disappear// 
            
            function collapseMenu(){
                let navContainer = document.getElementById("navigationBar");
                let mobileNav = navContainer.className;
                let webPages = document.getElementsByClassName("nav_list");

                //When clicked, changes the class of navigation list
                //and makes page links appear below hamburger menu.

                if (mobileNav == "nav") {
                    navContainer.className = "hamburgerNav";

                    //This code hates me :( 
                    //and wouldn't show them all at once with just an 'of' loop.
                    //The nested loop was the only solution I found to this problem.
                    
                    for (let i=0; i<4; i++){

                        for (const page of webPages){

                            page.className = "nav_list_mobile";
                            
                        }

                    }
                    
                } 

                //When clicked again, changes the class of navigation bar to
                //its initial class and hides page links.
                
                else {
                    let hamburgerPages = document.getElementsByClassName("nav_list_mobile")

                    navContainer.className = "nav";

                        //This code hates me :( 
                        //and wouldn't show them all at once with just an 'of' loop.
                        //The nested loop was the only solution I found to this problem.

                        for (let i=0; i<4; i++){
                            for (const page of hamburgerPages){
                                page.className = "nav_list"
                            }
                        }
                }
            }

            //Highlights move buttons when clicked//

            //Highlight function for ally team//

            function allyMoveHighlight(moveid){
                let firstMove = document.getElementById("move1");
                let secondMove = document.getElementById("move2");
                let thirdMove = document.getElementById("move3");
                let fourthMove = document.getElementById("move4");

                //Unhighlights all moves//

                firstMove.className= "ActiveMoveA";
                secondMove.className= "ActiveMoveA";
                thirdMove.className= "ActiveMoveA";
                fourthMove.className= "ActiveMoveA";

                //Decides which move to highlight based on user click//

                if (moveid == move1) {
                    firstMove.className= "selectedMove"
                } 
                else if (moveid == move2) {
                    secondMove.className= "selectedMove"
                }
                else if (moveid == move3) {
                    thirdMove.className= "selectedMove"
                } 
                
                else {
                    fourthMove.className= "selectedMove"
                }
            }

            //Highlight function for enemy team//

            function enemyMoveHighlight(moveid){
                let firstMove = document.getElementById("move5");
                let secondMove = document.getElementById("move6");
                let thirdMove = document.getElementById("move7");
                let fourthMove = document.getElementById("move8");

                //Unhighlights all moves//

                firstMove.className= "ActiveMoveA";
                secondMove.className= "ActiveMoveA";
                thirdMove.className= "ActiveMoveA";
                fourthMove.className= "ActiveMoveA";

                //Decides which move to highlight based on user click//

                if (moveid == move5) {
                    firstMove.className= "selectedMove"
                } 
                else if (moveid == move6) {
                    secondMove.className= "selectedMove"
                }
                else if (moveid == move7) {
                    thirdMove.className= "selectedMove"
                } 
                
                else {
                    fourthMove.className= "selectedMove"
                }
            }

            //gsets up pokemon addition list
            let pokeSearchList = []

            //checks sessionStorage and loads in 'saved' team
            let index = 0
            for (i = 1; i <7 ; i++) {
                if (sessionStorage[i]){
                    pokeSearchList.push(JSON.parse(sessionStorage.getItem(i)))
                    console.log(`loading index ${i}`)
                    pokeAdd()
                    pokeSearchList.pop()
                    index += 1
                }   else {
                    console.log(`empty session storage of index ${i}`)
                }
            };

            //adds pokemon data to each pokemon entry
            function pokeAdd(){
                //init pokmeon to add
                const pokemon = pokeSearchList[0]
                //create pokemon img element
                const pokeImage = image(pokemon["name"])

                if(index == 0) {
                    const ActivePkmon = document.querySelector(".ActiveSpriteA")
                    ActivePkmon.appendChild(pokeImage)
                } else {

                //main team locaiton
                const MainArea = document.querySelector(".PSpriteA")
                const teamArea = MainArea.querySelectorAll(".entry")

                //attaches pokemon data/pic to entry
                teamArea[index % 6 -1].entry = pokemon
                teamArea[index % 6 -1].appendChild(pokeImage)
                }
            };

            function image(name){
                const pokeImage = document.createElement('img')
                pokeImage.setAttribute('src', `static/img/pokemon_collection/${name}.webp`)
                pokeImage.setAttribute('alt', `${name} sprite`)
                pokeImage.setAttribute('class', 'pokeSprite')
                return pokeImage
            }
        </script>
    </body>
    </div>
</html>

        <script>
            console.log("ready to load .js")

            //index init for loading pokemon from session storage in order
            let index = 0

            async function pageLoad() {
                await loadTeam();
                activePokemonMoves();
                attachEvents();
            };
            
            function attachEvents() {

            }


            //Makes Hamburger menu appear and disappear// 
            function collapseMenu(){
                let navContainer = document.getElementById("navigationBar");
                let mobileNav = navContainer.className;
                let webPages = document.getElementsByClassName("nav_list");

                //When clicked, changes the class of navigation list
                //and makes page links appear below hamburger menu.

                if (mobileNav == "nav") {
                    navContainer.className = "hamburgerNav";

                    //This code hates me :( 
                    //and wouldn't show them all at once with just an 'of' loop.
                    //The nested loop was the only solution I found to this problem.
                    
                    for (let i=0; i<4; i++){

                        for (const page of webPages){

                            page.className = "nav_list_mobile";
                            
                        }

                    }
                    
                } 

                //When clicked again, changes the class of navigation bar to
                //its initial class and hides page links.
                
                else {
                    let hamburgerPages = document.getElementsByClassName("nav_list_mobile")

                    navContainer.className = "nav";

                        //This code hates me :( 
                        //and wouldn't show them all at once with just an 'of' loop.
                        //The nested loop was the only solution I found to this problem.

                        for (let i=0; i<4; i++){
                            for (const page of hamburgerPages){
                                page.className = "nav_list"
                            }
                        }
                }
            }

            //Highlights move buttons when clicked//

            //Highlight function for ally team//

            function allyMoveHighlight(moveid){

                //Unhighlights move if selected
                try {
                    const activeMoveList = document.querySelector('.MovesA')
                    const selectedMove = activeMoveList.querySelector('.selectedMove');
                    selectedMove.setAttribute('class', 'ActiveMoveA');
                } catch (error) {
                    //console.log('no move selected');
                };

                //unhighlights selected pokemon
                try {
                    const activePokemon = document.querySelector('#activePokemonHighlight');
                    activePokemon.setAttribute('id', 'activePokemon');
                    const selectedPokemon = document.querySelector(`.activeEntry`);
                    selectedPokemon.setAttribute('class', `entry`);
                } catch (error) {
                    //console.log('no pokemon selected');
                };

                //highlights selected move
                moveid.setAttribute('class', 'selectedMove');
            };

            //Highlight function for enemy team//

            function enemyMoveHighlight(moveid){
                let firstMove = document.getElementById("move5");
                let secondMove = document.getElementById("move6");
                let thirdMove = document.getElementById("move7");
                let fourthMove = document.getElementById("move8");

                //Unhighlights all moves//

                firstMove.className= "ActiveMoveA";
                secondMove.className= "ActiveMoveA";
                thirdMove.className= "ActiveMoveA";
                fourthMove.className= "ActiveMoveA";

                //Decides which move to highlight based on user click//

                if (moveid == move5) {
                    firstMove.className= "selectedMove"
                } 
                else if (moveid == move6) {
                    secondMove.className= "selectedMove"
                }
                else if (moveid == move7) {
                    thirdMove.className= "selectedMove"
                } 
                
                else {
                    fourthMove.className= "selectedMove"
                }
            }

            //adds pokemon data to each pokemon entry
            function pokeAdd(){
                //init pokmeon to add
                const pokemon = pokeSearchList[0]
                //create pokemon img element
                const pokeImage = image(pokemon["name"])
                pokeImage.entry = pokemon

                if(index == 0) {
                    const ActivePkmon = document.querySelector(".ActiveSpriteA")
                    pokeImage.setAttribute('id', 'activePokemon')
                    console.log(pokeImage)
                    ActivePkmon.appendChild(pokeImage)
                } else {

                //main team locaiton
                const MainArea = document.querySelector(".PSpriteA")
                const teamArea = MainArea.querySelectorAll(".entry")

                //attaches pokemon data/pic to entry
                pokeImage.setAttribute('id', `teamid${index%6+1}`)
                teamArea[index % 6 -1].appendChild(pokeImage)
                }
                index += 1
            };
        
            function activePokemonMoves() {
                //grabs active pokemon and extracts pokemon entry
                let activePokemonLoc = ''
                if (activePokemonLoc = document.querySelector('#activePokemon') == null){
                    activePokemonLoc = document.querySelector('#activePokemonHighlight')
                } else {
                    activePokemonLoc = document.querySelector('#activePokemon')
                    console.log(activePokemonLoc)
                }
                const pokemonEntry = activePokemonLoc.entry
                console.log('adding moves')
                const pokemonMoves = document.querySelectorAll('.ActiveMoveA')
                for (i = 0; i < MOVE_LIMIT; i++) {
                    console.log(`adding move ${i+1}`)
                    console.log(pokemonEntry)
                    pokemonMoves[i].innerHTML = `${pokemonEntry.selectedMoves[i]}`
                }
            }

            function toSwap(toSwap) {
                //grabs pokemon to swap
                console.log(toSwap)

                //grabs active pokemon
                let activePokemonloc = ''
                if (activePokemonloc = document.querySelector('#activePokemon') == null){
                    console.log('highlighted')
                    activePokemonloc = document.querySelector('#activePokemonHighlight')
                    console.log(activePokemonloc)
                } else {
                    activePokemonloc = document.querySelector('#activePokemon')
                    console.log('normal')
                }

                //unhighlights old pokemon if already chosen previously
                try {
                    const activeEntry = document.querySelector('.activeEntry')
                    activeEntry.setAttribute('class','entry')
                } catch (error) {
                }

                //grabs selected move if choesen and unhighlights
                try {
                    const activeMoveList = document.querySelector('.MovesA')
                    const selectedMove = activeMoveList.querySelector('.selectedMove');
                    selectedMove.setAttribute('class', 'ActiveMoveA')
                } catch (error) {
                }

                activePokemonloc.setAttribute('id','activePokemonHighlight')
                toSwap.setAttribute('class', `activeEntry`)
            }

            function turn() {
                //grabs active pokemon entry
                let activePokemon = ''
                let activePokemonloc = ''
                console.log('turn');
                try{
                    activePokemonloc = document.querySelector('#activePokemon');
                    activePokemon = activePokemonloc.entry;
                } catch (error){
                    activePokemonloc = document.querySelector('#activePokemonHighlight');
                    activePokemon = activePokemonloc.entry;
                }
                console.log(activePokemonloc);
                //grabs enemy pokemon entry
                // const activeEPokemonloc = document.querySelector('#activeEPokemon')
                // const enemyPokemon = activeEPokemonloc.entry

                //find selected actions (moves or swapping)
                //find  if selected moves
                // try {
                //     const selectedMove = document.querySelector('.selectedMove');
                //     selectedMove.setAttribute('class', 'ActiveMoveA');
                // } catch (error) {
                // };
                //determines if swapping
                
                try {
                    //find DOM element nodes
                    const activePokemon = document.querySelector('#activePokemonHighlight');
                    const selectedPokemon = document.querySelector(`.activeEntry`).childNodes[1];

                    //peel entries
                    const activeEntry = activePokemon.entry
                    const selectedEntry = selectedPokemon.entry

                    console.log('progress')
                    //apply new entries to DOM nodes
                    activePokemon.entry = selectedEntry
                    selectedPokemon.entry = activeEntry

                    // update DOM elements nodes with new img
                    activePokemon.setAttribute('src',`static/img/pokemon_collection/${activePokemon.entry.name}.webp`)
                    selectedPokemon.setAttribute('src',`static/img/pokemon_collection/${selectedPokemon.entry.name}.webp`)

                    activePokemonMoves();
                } catch (error) {
                    console.log('not swaping')
                };

            }

        </script>

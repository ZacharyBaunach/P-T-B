<!DOCTYPE html>
<html>
    <head>
        <title>
            Pokemon Team Builder Battle
        </title>
        <link rel="stylesheet" href="static/css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <div class="pageBox">
    <body>
        <header>
            <a href="ptb.html"> 
            <img src="static/img/Logo.png" alt="Logo" class="site-logo" >
            </a>

            <h1>Pokemon Battle</h1>

            <ul id="navigationBar" class ="nav">
                <!-- Hamburger menu toggle the navigation links -->
                <li>
                    <a href="javascript:void(0);" class="icon" onclick="collapseMenu()">
                        <i class="fa fa-bars"></i>
                    </a>
                </li>
                <li class="nav_list"><a class="nav_link" href="ptb.html">Home</a></li>
                <li class="nav_list"><a class="nav_link" href="battle.html">Battle</a></li>
                <li class="nav_list"><a class="nav_link" href="about.html">About Us</a></li>
                <li class="nav_list"><a class="nav_link" href="feedback.html">Give Feedback</a></li>
            </ul>

            
        </header>

        <ul class="BattleContainer">
            
                <li class="PSpriteA">
                    <div class="entry"><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div class="entry"><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div class="entry"><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div class="entry"><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div class="entry"><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                        
                </li>

                <li class="MovesA">
                    <div>
                        <div id="move1" class="ActiveMoveA" onclick="moveHighlight(move1)">Move</div>
                        <div class="ActiveMoveA">Move</div>
                    </div>
                    <div>
                        <div class="ActiveMoveA">Move</div>
                        <div class="ActiveMoveA">Move</div>
                    </div>
                </li>

                <li class="ActiveSpriteA">
                    <img class="ASprite" src="static/img/Pokeball.png" alt="Sprite">
                </li>

                <li class="ActiveSpriteE">
                    <img class="ESprite" src="static/img/Pokeball.png" alt="Sprite">
                </li>

                <li class="MovesE">
                    <div>
                        <div id="move5" class="ActiveMoveE">Move</div>
                        <div class="ActiveMoveE">Move</div>
                    </div>
                    <div>
                        <div class="ActiveMoveE">Move</div>
                        <div class="ActiveMoveE">Move</div>
                    </div>
                </li>

                <li class="PSpriteE">
                    <div><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                    <div><img class="Sprite" src="static/img/Pokeball.png" alt="Sprite"></div>
                        
                </li>
            
        </ul>

        <div id="startTurn">
            Start Turn
        </div>

        <ul class="BattleWindowContainer">
            

            <li class="BattleWindow">

            </li>
        </ul>
        <script>
            //Makes Hamburger menu appear and disappear// 
            
            function collapseMenu(){
                let navContainer = document.getElementById("navigationBar");
                let mobileNav = navContainer.className;
                let webPages = document.getElementsByClassName("nav_list");
                if (mobileNav == "nav") {
                    navContainer.className = "hamburgerNav";
                    
                    for (let i=0; i<4; i++){

                        for (const page of webPages){

                            page.className = "nav_list_mobile";
                            
                        }

                    }
                    
                } 
                
                else {
                    let hamburgerPages = document.getElementsByClassName("nav_list_mobile")

                    navContainer.className = "nav";

                        for (let i=0; i<4; i++){
                            for (const page of hamburgerPages){
                                page.className = "nav_list"
                            }
                        }
                }
            }

            //Highlights move buttons when clicked//

            function moveHighlight(moveid){
                let moveToHighlight = document.getElementById(String(moveid));

                moveToHighlight.className = "selectedMove"
            }

            //gsets up pokemon addition list
            let pokeSearchList = []

            //checks sessionStorage and loads in 'saved' team
            let index = 0
            for (i = 1; i <7 ; i++) {
                if (sessionStorage[i]){
                    pokeSearchList.push(JSON.parse(sessionStorage.getItem(i)))
                    console.log(`loading index ${i}`)
                    pokeAdd()
                    pokeSearchList.pop()
                    index += 1
                }   else {
                    console.log(`empty session storage of index ${i}`)
                }
            };

            //adds pokemon data to each pokemon entry
            function pokeAdd(){
                //init pokmeon to add
                const pokemon = pokeSearchList[0]
                //create pokemon img element
                const pokeImage = image(pokemon["name"])

                if(index == 0) {
                    const ActivePkmon = document.querySelector(".ActiveSpriteA")
                    ActivePkmon.appendChild(pokeImage)
                } else {

                //main team locaiton
                const MainArea = document.querySelector(".PSpriteA")
                const teamArea = MainArea.querySelectorAll(".entry")

                //attaches pokemon data/pic to entry
                teamArea[index % 6 -1].entry = pokemon
                teamArea[index % 6 -1].appendChild(pokeImage)
                }
            };

            function image(name){
                const pokeImage = document.createElement('img')
                pokeImage.setAttribute('src', `static/img/pokemon_collection/${name}.webp`)
                pokeImage.setAttribute('alt', `${name} sprite`)
                pokeImage.setAttribute('class', 'pokeSprite')
                return pokeImage
            }
        </script>
    </body>
    </div>
</html>
